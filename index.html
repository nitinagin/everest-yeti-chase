<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>EVEREST: YETI CHASE</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#89c9e8;font-family:system-ui,-apple-system,sans-serif;touch-action:none}canvas{display:block;width:100%;height:100%}.hud{position:fixed;top:max(18px,env(safe-area-inset-top));left:18px;color:white;text-shadow:0 2px 6px #173b59;font-weight:900;font-size:20px;pointer-events:none}.hud small{font-size:12px;letter-spacing:2px}.right{position:fixed;top:max(22px,env(safe-area-inset-top));right:18px;color:#fff;text-shadow:0 2px 6px #173b59;font-weight:800}.overlay{position:fixed;inset:0;background:#103752a8;display:flex;align-items:center;justify-content:center;color:#fff;text-align:center;padding:25px}.panel{width:min(430px,100%)}h1{font-size:clamp(38px,10vw,64px);line-height:.95;margin:0 0 18px;text-shadow:0 5px 0 #164e71}p{font-size:18px;line-height:1.5}button{border:0;border-radius:20px;background:#ffe36a;color:#173750;font-size:24px;font-weight:950;padding:20px 24px;width:100%;margin-top:18px;box-shadow:0 7px 0 #d7a941}button:active{transform:translateY(4px);box-shadow:0 3px 0 #d7a941}.hint{font-size:13px;opacity:.9;margin-top:20px}.hide{display:none}</style></head>
<body><canvas id="game"></canvas><div class="hud"><small>EVEREST • YETI CHASE</small><div id="score">0 m</div><div id="health">❤️❤️❤️</div></div><div class="right" id="speed">65 km/h</div><div class="overlay" id="overlay"><div class="panel"><h1 id="title">🏔️ YETI<br>CHASE</h1><p id="message">POV SKI ESCAPE<br>Outrun the Yeti. Dodge rocks, trees and ice!</p><button id="tilt" style="background:#b7e9ff;font-size:17px;padding:15px">ENABLE PHONE TILT 📱</button><button id="start">START SKIING ⛷️</button><div class="hint">TILT PHONE LEFT / RIGHT • OR DRAG TO STEER</div></div></div>
<script>
(()=>{'use strict';const c=document.getElementById('game'),ctx=c.getContext('2d'),overlay=document.getElementById('overlay'),btn=document.getElementById('start'),scoreEl=document.getElementById('score'),healthEl=document.getElementById('health'),speedEl=document.getElementById('speed');let W=0,H=0,dpr=1,running=false,last=0,dist=0,hp=3,player=0,steer=0,objects=[],spawn=0,invuln=0,yeti=0,frame=0;const rand=(a,b)=>a+Math.random()*(b-a);function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);c.width=Math.round(W*dpr);c.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function start(){running=true;overlay.classList.add('hide');dist=0;hp=3;player=0;steer=0;objects=[];spawn=0;invuln=0;yeti=0;last=performance.now();scoreEl.textContent='0 m';healthEl.textContent='❤️❤️❤️';requestAnimationFrame(loop)}btn.addEventListener('click',start);btn.addEventListener('touchend',e=>{e.preventDefault();if(!running)start()},{passive:false});function move(x){if(tiltEnabled)return;steer=Math.max(-1,Math.min(1,(x/W-.5)*2.4))}c.addEventListener('pointermove',e=>{if(running)move(e.clientX)});c.addEventListener('pointerdown',e=>{if(running)move(e.clientX)});addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')steer=-1;if(e.key==='ArrowRight'||e.key==='d')steer=1});addEventListener('keyup',()=>steer=0);
let tiltEnabled=false,tiltBaseline=null,tiltValue=0;
function tiltHandler(e){if(!running||!tiltEnabled)return;const g=e.gamma;if(typeof g!=='number')return;if(tiltBaseline===null)tiltBaseline=g;let delta=g-tiltBaseline;delta=((delta+180)%360+360)%360-180;tiltValue=Math.max(-1,Math.min(1,delta/24));steer=Math.abs(tiltValue)<.08?0:tiltValue}
addEventListener('deviceorientation',tiltHandler,true);
const tiltBtn=document.getElementById('tilt');
tiltBtn.addEventListener('click',async()=>{try{if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){const permission=await DeviceOrientationEvent.requestPermission();if(permission!=='granted')throw Error('Motion permission denied')}tiltEnabled=true;tiltBaseline=null;tiltBtn.textContent='TILT ON ✓ • RECENTER';tiltBtn.style.background='#a5f0cf'}catch(err){tiltBtn.textContent='TILT UNAVAILABLE • DRAG TO STEER';tiltBtn.style.background='#ffd1ba'}});
tiltBtn.addEventListener('touchend',e=>e.stopPropagation(),{passive:true});
function poly(pts,fill){ctx.fillStyle=fill;ctx.beginPath();pts.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.closePath();ctx.fill()}function line(x1,y1,x2,y2,color,width){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}function ellipse(x,y,rx,ry,col){ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill()}
function scene(){let horizon=H*.35;let sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#3577aa');sky.addColorStop(.48,'#b5e7f8');sky.addColorStop(1,'#f8ffff');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);poly([[0,horizon],[W*.14,horizon-115],[W*.28,horizon-25],[W*.47,horizon-185],[W*.68,horizon-35],[W*.86,horizon-140],[W,horizon-20],[W,horizon+60],[0,horizon+60]],'#c8e0ee');poly([[W*.25,horizon],[W*.47,horizon-185],[W*.68,horizon]],'#f7fcff');poly([[0,horizon+55],[W*.2,horizon-55],[W*.42,horizon+65],[W*.73,horizon-100],[W,horizon+60]],'#9dbfd2');poly([[W*.16,horizon+35],[W*.2,horizon-55],[W*.26,horizon+35]],'#fff');ctx.fillStyle='#effbff';ctx.fillRect(0,horizon,W,H-horizon);const bend=-player*W*.18;poly([[W*.26+bend,horizon],[W*.74+bend,horizon],[W*1.6-player*W*.25,H],[-W*.6-player*W*.25,H]],'#e1f4fc');for(let i=0;i<15;i++){let z=((i/15+dist/150)%1),y=horizon+(H-horizon)*z*z,x=W/2+bend*(1-z)-player*W*.17*z;line(x-W*(.14+.6*z),y,x-W*(.14+.6*z)+15*z,y+7*z,'#c3e3f1',1+3*z)}}
function drawObj(o){let z=o.z;if(z<=0||z>1.3)return;let horizon=H*.35;let y=horizon+(H-horizon)*z*z;let x=W/2+(o.x-player)*W*(.08+.53*z)+(-player*W*.16)*(1-z);let s=(.15+z*z*2.2)*Math.min(W,H)*.12;ellipse(x,y+s*.08,s*.45,s*.12,'#bad6e4');if(o.type==='tree'){poly([[x,y-s*1.5],[x-s*.6,y+s*.2],[x+s*.6,y+s*.2]],'#1a6371');poly([[x,y-s*1.9],[x-s*.46,y-s*.4],[x+s*.46,y-s*.4]],'#237e83');line(x,y-s*.1,x,y+s*.35,'#715c54',s*.1)}else if(o.type==='rock'){poly([[x-s*.65,y],[x-s*.45,y-s*.6],[x+s*.2,y-s*.85],[x+s*.65,y-s*.12],[x+s*.4,y+s*.12]],'#667d93');poly([[x-s*.45,y-s*.6],[x+s*.2,y-s*.85],[x+s*.38,y-s*.5]],'#d8eaf4')}else{poly([[x-s*.6,y],[x,y-s*.85],[x+s*.55,y]],'#a3e5ef');poly([[x,y-s*.85],[x+s*.55,y],[x+s*.05,y-s*.1]],'#d7ffff')}}
function skis(){const x=W/2,y=H+35,bob=Math.sin(frame*.13)*4;for(let side of [-1,1]){let sx=x+side*W*.13-player*12;line(sx,y,sx+side*W*.05,y-H*.25+bob,'#223c5c',Math.max(9,W*.025));line(sx,y,sx+side*W*.05,y-H*.25+bob,'#f5a845',Math.max(5,W*.012));ellipse(sx+side*W*.02,H*.91,W*.042,H*.027,'#273c55')}line(W*.08,H*.92,W*.24,H*.67,'#343d4c',5);line(W*.92,H*.92,W*.76,H*.67,'#343d4c',5)}
function drawYeti(){let pulse=.5+.5*Math.sin(frame*.07),size=Math.min(W,H)*(.15+yeti*.13);let x=W*.5+Math.sin(frame*.045)*W*.23,y=H*.29+Math.sin(frame*.12)*7;ellipse(x,y,size*.46,size*.57,'#f5fbff');ellipse(x,y-size*.22,size*.35,size*.34,'#eaf4fc');ellipse(x-size*.16,y-size*.28,size*.07,size*.09,'#173c55');ellipse(x+size*.16,y-size*.28,size*.07,size*.09,'#173c55');ellipse(x,y-size*.09,size*.2,size*.1,'#385f78');line(x-size*.32,y+size*.28,x-size*.56,y+size*.5,'#eaf4fc',size*.23);line(x+size*.32,y+size*.28,x+size*.56,y+size*.5,'#eaf4fc',size*.23);ctx.font='bold 13px system-ui';ctx.textAlign='center';ctx.fillStyle='#fff';ctx.fillText('⚠ YETI IS CHASING!',W/2,H*.15);if(pulse>.97&&yeti>.65){ctx.fillStyle='#ffffff44';ctx.fillRect(0,0,W,H)}}
function end(){running=false;document.getElementById('title').innerHTML='YETI<br>GOT YOU!';document.getElementById('message').textContent='You survived '+Math.floor(dist)+' meters. Try again!';btn.textContent='RETRY SKIING ⛷️';overlay.classList.remove('hide')}
function loop(t){if(!running)return;let dt=Math.min((t-last)/1000,.04);last=t;frame++;dist+=dt*(17+Math.min(dist/60,14));player+=steer*dt*1.5;player=Math.max(-1.5,Math.min(1.5,player));spawn-=dt;if(spawn<=0){objects.push({x:rand(-1.45,1.45),z:0,type:['tree','rock','ice'][Math.floor(Math.random()*3)]});spawn=rand(.4,.8)}for(const o of objects){o.z+=dt*(.32+Math.min(dist/3000,.15));if(o.z>1.02&&o.z<1.12&&Math.abs(o.x-player)<.24&&invuln<=0){hp--;invuln=1.4;yeti=Math.min(1,yeti+.23);healthEl.textContent='❤️'.repeat(hp)+'🖤'.repeat(3-hp);if(hp<=0){end();return}}}objects=objects.filter(o=>o.z<1.3);invuln=Math.max(0,invuln-dt);yeti=Math.min(1,Math.max(0,yeti+dt*.007));scene();objects.sort((a,b)=>a.z-b.z).forEach(drawObj);if(dist>90&&Math.sin(dist/90)>.5)drawYeti();skis();if(invuln>0&&Math.floor(frame/5)%2===0){ctx.fillStyle='#ff555544';ctx.fillRect(0,0,W,H)}scoreEl.textContent=Math.floor(dist)+' m';speedEl.textContent=Math.floor(65+Math.min(dist/35,65))+' km/h';requestAnimationFrame(loop)}scene();skis();})();
</script></body></html>
